<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>منوی دیجیتال کافه — پنل مدیریت</title>
    <!-- System fonts first — Google Fonts is often blocked/slow in Iran and was render-blocking. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0c0a09;
        color: #fafaf9;
        font-family: Tahoma, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      .boot {
        min-height: 100%;
        display: grid;
        place-items: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        color: #a8a29e;
        font-size: 14px;
      }
      .boot-card {
        width: min(100%, 24rem);
        background: #1c1917;
        border: 1px solid #292524;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      .boot-title { color: #fafaf9; font-weight: 700; font-size: 1.125rem; margin: 0 0 0.35rem; }
      .boot-sub { margin: 0; font-size: 0.75rem; color: #78716c; }
      .boot-spin {
        width: 1.25rem;
        height: 1.25rem;
        margin: 1rem auto 0;
        border: 2px solid #44403c;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Non-blocking optional Vazirmatn (skipped if unreachable). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-card">
          <p class="boot-title">پنل منوی کافه</p>
          <p class="boot-sub">در حال بارگذاری…</p>
          <div class="boot-spin" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <div class="boot-card">
          <p class="boot-title">جاوااسکریپت لازم است</p>
          <p class="boot-sub">برای ورود به پنل، JavaScript را روشن کنید.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
